name: Sync production homepage from GitLab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-home-from-gitlab.yml'
  workflow_dispatch:
  schedule:
    # GitLab is the frontend source of record. Poll off the hour to keep the
    # GitHub mirror current without creating a high-frequency background job.
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: xrbc-home-production-sync
  cancel-in-progress: true

jobs:
  sync-home:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out GitHub Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the current GitLab Pages build
        shell: bash
        run: |
          set -euo pipefail
          base='https://xrbitcoincash-project-15389d.gitlab.io'
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch() {
            local source="$1"
            local target="$2"
            curl               --fail               --location               --retry 12               --retry-delay 5               --retry-all-errors               --connect-timeout 15               --max-time 60               -H 'Cache-Control: no-cache'               -H 'Pragma: no-cache'               "$source"               -o "$target"
          }

          # build-info.json is generated by the GitLab Pages deployment itself,
          # so it identifies the exact artifact rather than a repository guess.
          fetch "$base/build-info.json?xrbc_sync=$stamp" build-info.json.next
          source_commit="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('build-info.json.next').read_text(encoding='utf-8'))
          commit = str(data.get('commit', '')).strip()
          source = str(data.get('source', '')).strip()
          if len(commit) != 40 or any(ch not in '0123456789abcdefABCDEF' for ch in commit):
              raise SystemExit('invalid GitLab build-info commit')
          if source != 'gitlab-pages':
              raise SystemExit('unexpected GitLab build-info source')
          print(commit)
          PY
          )"

          fetch "$base/?xrbc_sync=$stamp" index.html.next
          fetch "$base/xrbc-home-compact.css?xrbc_sync=$stamp" xrbc-home-compact.css.next
          fetch "$base/xrbc-home-compact.js?xrbc_sync=$stamp" xrbc-home-compact.js.next
          fetch "$base/xrbc-liquidity-model.js?xrbc_sync=$stamp" xrbc-liquidity-model.js.next

          test -s index.html.next
          test -s xrbc-home-compact.css.next
          test -s xrbc-home-compact.js.next
          test -s xrbc-liquidity-model.js.next
          grep -q 'data-xrbc-compact="style"' index.html.next
          grep -q 'data-xrbc-compact="script"' index.html.next
          grep -q 'data-xrbc-compact="liquidity-model"' index.html.next
          grep -Fq "name=\"xrbc-build-id\" content=\"$source_commit\"" index.html.next
          grep -q 'xrbc-liquidity-impact' xrbc-liquidity-model.js.next

          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path('build-info.json.next').read_text(encoding='utf-8'))
          if info.get('ref') != 'master':
              raise SystemExit('GitLab build is not from master')
          print('Verified GitLab Pages build', info['commit'])
          PY

          mv index.html.next index.html
          mv xrbc-home-compact.css.next xrbc-home-compact.css
          mv xrbc-home-compact.js.next xrbc-home-compact.js
          mv xrbc-liquidity-model.js.next xrbc-liquidity-model.js
          mv build-info.json.next build-info.json

      - name: Commit production mirror only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add index.html xrbc-home-compact.css xrbc-home-compact.js xrbc-liquidity-model.js build-info.json
          if git diff --cached --quiet; then
            echo 'GitHub Pages homepage mirror is already synchronized.'
            exit 0
          fi
          git config user.name 'XRBC Production Sync'
          git config user.email 'xrbitcoincash@users.noreply.github.com'
          source_commit="$(python -c "import json; print(json.load(open('build-info.json'))['commit'][:12])")"
          git commit -m "Sync GitLab Pages build $source_commit"
          git push origin HEAD:main
