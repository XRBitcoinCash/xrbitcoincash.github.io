<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRBitcoinCash</title>
  <link rel="canonical" href="https://xrbitcoincash.com/">
  <meta http-equiv="refresh" content="1; url=https://xrbitcoincash.com/">
  <script>
    const destination = new URL("https://xrbitcoincash.com/");
    destination.pathname = window.location.pathname;
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    if (window.location.hostname !== destination.hostname) {
      window.location.replace(destination.href);
    }
  </script>
</head>
<body>
  <p>Continue to <a href="https://xrbitcoincash.com/">XRBitcoinCash</a>.</p>
</body>
</html>
